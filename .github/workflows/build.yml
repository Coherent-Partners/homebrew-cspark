name: Build

permissions:
  contents: read

on:
  push:
    paths-ignore: ['**.md', 'LICENSE']
  schedule:
    - cron: '0 4 1 * *' # Run at 4:00 on the first day of the month

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Tap the repository
        run: brew tap Coherent-Partners/cspark

      - name: Install formula
        run: brew install cspark

      - name: Check basic commands
        run: |
          cspark --version
          cspark --help
